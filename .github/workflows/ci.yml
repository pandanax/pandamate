name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.8
      - uses: actions/setup-node@v6
        with:
          node-version: 26.5.0
          cache: pnpm
      - name: Install tmux
        run: brew install tmux
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
